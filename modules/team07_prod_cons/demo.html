<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo - Producer/Consumer</title>
  
  <style>
    /* Updated for Full Screen */
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background-color: #e5e7eb;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden; /* Prevent body scroll if content fits */
    }
    #dashboard-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
      width: 100%;
      height: 100%;
    }
    .demo-header {
      padding: 1rem;
      background: #111827;
      color: white;
    }
    #module-root {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
  </style>

  <link rel="stylesheet" href="style.css">
  <script src="module.js"></script>
</head>
<body>

  <div id="dashboard-container">
    <div class="demo-header">
      <h3 id="module-title" style="margin:0; font-size:1rem; font-weight:normal;"></h3>
    </div>
    <div id="module-root"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const mod = window.OSDashboard.modules["team07_prod_cons"];
      document.getElementById('module-title').textContent = mod.title;
      
      const root = document.getElementById('module-root');
      mod.render(root);

      setInterval(() => {
        const metrics = mod.getMetrics();
        console.log(`[Metrics] ${metrics.primaryMetricLabel}: ${metrics.primaryMetricValue}${metrics.unit}`);
      }, 2000);
    });
  </script>

</body>
</html>
